function renderData(){let checks=runChecks();return pageHead('Cơ sở dữ liệu','Quản lý thư viện cây và kiểm tra dữ liệu lưu trên thiết bị.','')+'<div class="grid two"><section class="card"><h3>Thư viện cây trồng <span class="badge">'+db.catalog.filter(c=>!c.archived).length+' mục</span></h3><div class="toolbar"><input id="catSearch" placeholder="Tìm loại cây hoặc giống…" oninput="renderCatalog()"><button class="btn" onclick="openCatalog()">+ Thêm loại / giống</button></div><div id="catalogList" class="unknown-list"></div></section><section class="card"><h3>Kiểm tra dữ liệu</h3><div class="grid stats" style="grid-template-columns:repeat(2,1fr)"><div class="click-card card"><div class="stat-label">Block</div><div class="stat-value">'+db.blocks.filter(b=>!b.archived&&!b.isReferenceGroup).length+'</div></div><div class="click-card card"><div class="stat-label">Cây trồng</div><div class="stat-value">'+db.plantings.length+'</div></div><div class="click-card card"><div class="stat-label">Nhật ký</div><div class="stat-value">'+db.activities.length+'</div></div><div class="click-card card"><div class="stat-label">Cần xem</div><div class="stat-value">'+checks.length+'</div></div></div>'+(checks.length?'<div>'+checks.slice(0,8).map(c=>'<div class="unknown-item"><span class="badge '+(c.level==='Lỗi'?'red':'warn')+'">'+c.level+'</span> '+escapeHtml(c.text)+'</div>').join('')+'</div>':'<div class="empty-soft">Không phát hiện lỗi liên kết hoặc vị trí.</div>')+'<div class="row" style="margin-top:10px"><button class="btn" onclick="runCheckToast()">Kiểm tra lại</button><button class="btn" onclick="downloadChecks()">Xuất kết quả</button></div></section></div>'}

function dateKey(d){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh'}).format(d)}
function calendarMove(step){let d=new Date(calendarAnchor+'T12:00:00');if(calendarMode==='month')d.setMonth(d.getMonth()+step);else d.setDate(d.getDate()+7*step);calendarAnchor=dateKey(d);render()}
function renderCalendar(){let anchor=new Date(calendarAnchor+'T12:00:00'),nowKey=TODAY,events=db.activities.slice().sort((a,b)=>a.createdAt.localeCompare(b.createdAt));let head='<div class="calendar-toolbar"><div class="tabs"><button class="'+(calendarMode==='week'?'active':'')+'" onclick="calendarMode=\'week\';render()">Tuần</button><button class="'+(calendarMode==='month'?'active':'')+'" onclick="calendarMode=\'month\';render()">Tháng</button></div><div class="row"><button class="btn small" onclick="calendarMove(-1)">‹</button><button class="btn small" onclick="calendarAnchor=TODAY;render()">Hôm nay</button><button class="btn small" onclick="calendarMove(1)">›</button></div></div>';let start,end,title;if(calendarMode==='month'){start=new Date(anchor.getFullYear(),anchor.getMonth(),1,12);let gridStart=new Date(start);gridStart.setDate(start.getDate()-((start.getDay()+6)%7));start=gridStart;end=new Date(start);end.setDate(start.getDate()+41);title='Tháng '+String(anchor.getMonth()+1).padStart(2,'0')+'/'+anchor.getFullYear()}else{start=new Date(anchor);start.setDate(anchor.getDate()-((anchor.getDay()+6)%7));end=new Date(start);end.setDate(start.getDate()+6);title='Tuần '+fmtDate(dateKey(start))+' – '+fmtDate(dateKey(end))}let days=[];for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1))days.push(new Date(d));let dow=['T2','T3','T4','T5','T6','T7','CN'].map(x=>'<div class="cal-dow">'+x+'</div>').join('');let cells=days.map(d=>{let key=dateKey(d),dayEvents=events.filter(a=>dateKey(new Date(a.createdAt))===key),other=calendarMode==='month'&&d.getMonth()!==anchor.getMonth();return '<div class="cal-cell '+(other?'other ':'')+(key===nowKey?'today':'')+'" onclick="openActivity(\''+key+'\')"><div class="cal-day">'+d.getDate()+'</div>'+dayEvents.slice(0,3).map(a=>'<div class="cal-event '+(new Date(a.createdAt)>new Date()?'future':'')+'">'+escapeHtml(a.title)+'</div>').join('')+(dayEvents.length>3?'<div class="smalltext muted">+'+(dayEvents.length-3)+'</div>':'')+'</div>'}).join('');let upcoming=events.filter(a=>new Date(a.createdAt)>=new Date()).slice(0,8);return pageHead('Lịch tổng quan','Tổng hợp công việc đã làm và công việc được đặt lịch. Chạm ngày để thêm công việc.','<button class="btn primary" onclick="openActivity()">+ Công việc</button>')+'<section class="card">'+head+'<h3 style="margin-top:12px">'+title+'</h3><div class="calendar-grid">'+dow+cells+'</div></section><section class="card" style="margin-top:12px"><h3>Sắp tới</h3>'+(upcoming.length?'<div class="timeline">'+upcoming.map(a=>'<div class="event"><strong>'+escapeHtml(a.title)+'</strong><div class="smalltext">'+escapeHtml(a.note||'')+'</div><small>'+fmtTime(a.createdAt)+'</small></div>').join('')+'</div>':'<div class="empty-soft">Chưa có công việc tương lai.</div>')+'</section>'}
function renderCatalog(){let el=document.getElementById('catalogList');if(!el)return;let q=(document.getElementById('catSearch')?.value||'').toLowerCase();el.innerHTML=db.catalog.filter(c=>!c.archived&&(!q||(c.kind+' '+c.variety+' '+c.group).toLowerCase().includes(q))).map(c=>'<div class="unknown-item"><strong>'+escapeHtml(c.kind)+' · '+escapeHtml(c.variety)+'</strong><span class="muted"> · '+escapeHtml(c.group)+'</span><button class="btn small" style="float:right" onclick="editCatalog(\''+c.id+'\')">Sửa</button></div>').join('')||'<div class="muted">Không có kết quả.</div>'}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalBack').classList.add('show')};function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function openQuick(){openModal('Thêm mới','<div class="grid three"><button class="btn" onclick="closeModal();openPlant()">🌱 Cây trồng</button><button class="btn" onclick="closeModal();openBlock()">▱ Chậu / luống</button><button class="btn" onclick="closeModal();openActivity()">✎ Hoạt động</button><button class="btn" onclick="closeModal();openIssue()">⚠ Sự vụ</button></div>')}
function openPlant(existing,preBlock){let p=existing?db.plantings.find(x=>x.id===existing):null;let opts=db.catalog.filter(c=>!c.archived).map(c=>'<option value="'+c.id+'" '+(p?.catalogId===c.id?'selected':'')+'>'+escapeHtml(c.kind+' · '+c.variety)+'</option>').join('');let chosenBlock=p?.blockId||preBlock||'';let bopts=db.blocks.filter(b=>b.archived!==true&&!b.isReferenceGroup&&b.type!=='Nhóm tham chiếu').map(b=>'<option value="'+b.id+'" '+(chosenBlock===b.id?'selected':'')+'>'+escapeHtml(b.name+' — '+zoneName(b.zoneId))+'</option>').join('');openModal(p?'Sửa cây trồng':'Thêm cây trồng','<form onsubmit="savePlant(event,\''+(p?.id||'')+'\')"><div class="form-grid"><div class="field full"><label>Loại cây / giống</label><div class="plant-picker"><input id="pCatalogSearch" type="search" placeholder="Gõ để tìm: đu đủ, cà chua, dưa leo…" oninput="filterPlantCatalogOptions()"><select id="pCatalog" required><option value="">Chọn cây hoặc giống</option>'+opts+'</select></div><button type="button" class="btn small" style="margin-top:5px" onclick="openCatalog()">+ Thêm giống mới</button></div><div class="field"><label>Block / chậu</label><select id="pBlock"><option value="">Chưa gán vị trí</option>'+bopts+'</select></div><div class="field"><label>Số cây</label><input id="pCount" type="number" value="'+(p?.count||1)+'" min="1" step="1"></div><div class="field"><label>Nguồn cây</label><select id="pSource"><option>Không rõ</option>'+['Hạt','Cây giống','Giâm cành','Chiết/ghép'].map(v=>'<option '+(p?.source===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="field"><label>Tình trạng</label><select id="pCondition">'+['Bình thường','Cần theo dõi','Có vấn đề'].map(v=>'<option '+((p?.condition||'Bình thường')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="field"><label>Ngày gieo</label><div class="date-with-clear"><input id="pSowDate" type="date" value="'+(p?.sown?.date||'')+'"><button type="button" class="btn small" onclick="clearDate(\'pSowDate\')">Xóa</button></div></div><div class="field"><label>Ngày trồng</label><div class="date-with-clear"><input id="pDate" type="date" value="'+(p?.planted?.date||'')+'"><button type="button" class="btn small" onclick="clearDate(\'pDate\')">Xóa</button></div></div><div class="field full"><label>Ghi chú</label><textarea id="pNote">'+escapeHtml(p?.note||'')+'</textarea></div></div><p class="note">Không cần nhập tuổi cây. App tự tính tuổi từ ngày trồng; nếu chưa có ngày trồng sẽ dùng ngày gieo. Cả hai ngày đều có thể để trống.</p><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Lưu cây</button></div></form>') }
function sowAccuracyOptions(sel){return [['exact','Chính xác'],['unknown','Không rõ']].map(x=>'<option value="'+x[0]+'" '+(sel===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')}
function accuracyOptions(sel,has){return [['exact','Chính xác'],['range','Khoảng ngày'],['month','Chỉ biết tháng/năm'],['year','Chỉ biết năm'],['unknown','Không rõ']].map(x=>'<option value="'+x[0]+'" '+(sel===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')}
function savePlant(e,editId){e.preventDefault();let cat=document.getElementById('pCatalog').value;if(!cat){toast('Hãy chọn loại cây hoặc giống.');return}let date=document.getElementById('pDate').value,sowd=document.getElementById('pSowDate').value;let planted={date:date||null,accuracy:date?'exact':'unknown',month:null,year:null,endDate:null,age:null},sow={date:sowd||null,accuracy:sowd?'exact':'unknown'};if(date&&sowd&&sowd>date){if(!confirm('Ngày gieo đang sau ngày trồng. Vẫn lưu?'))return}let old=editId&&db.plantings.find(x=>x.id===editId);undoDb=structuredClone(db);let obj={id:old?.id||id('PLT'),catalogId:cat,blockId:document.getElementById('pBlock').value||null,count:+document.getElementById('pCount').value||1,source:document.getElementById('pSource').value,condition:document.getElementById('pCondition').value,status:old?.status||'Đang trồng',planted,sown,note:document.getElementById('pNote').value.trim(),createdAt:old?.createdAt||nowISO(),updatedAt:nowISO()};if(old)Object.assign(old,obj);else db.plantings.push(obj);db.audit.push({at:nowISO(),action:old?'Sửa đợt trồng':'Tạo đợt trồng',target:obj.id});closeModal();persist(old?'Đã cập nhật cây trồng.':'Đã lưu cây trồng.',true)}
function editPlant(i){openPlant(i)}
function endPlant(i,reason,date){let p=db.plantings.find(x=>x.id===i);if(!p)return;p.status='Đã kết thúc';p.ended={date:date||TODAY,reason:reason||'Khác'};p.updatedAt=nowISO();db.audit.push({at:nowISO(),action:'Kết thúc đợt trồng: '+p.ended.reason,target:i})}
function endPlantAsk(i){let p=db.plantings.find(x=>x.id===i);let linked=db.activities.some(a=>a.plantingId===i);openModal('Kết thúc / lưu trữ đợt trồng','<div class="field"><label>Đợt trồng</label><input value="'+escapeHtml(cropName(i))+'" disabled></div><div class="field"><label>Lý do kết thúc</label><select id="endReason">'+['Thu hoạch xong','Cây chết','Sâu bệnh','Thay cây','Chuyển vị trí','Khác'].map(v=>'<option>'+v+'</option>').join('')+'</select></div><div class="field"><label>Ngày kết thúc</label><input type="date" id="endDate" value="'+TODAY+'"></div><p class="note">Nhật ký liên quan: '+(linked?'có — sẽ được giữ lại.':'chưa có')+' Block sẽ trở về trạng thái trống.</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn danger" onclick="confirmEnd(\''+i+'\')">Kết thúc đợt trồng</button></div>')}
function confirmEnd(i){let r=document.getElementById('endReason').value,d=document.getElementById('endDate').value;undoDb=structuredClone(db);endPlant(i,r,d);closeModal();persist('Đã kết thúc đợt trồng; lịch sử được giữ lại.',true)}
function archivePlant(i){let p=db.plantings.find(x=>x.id===i);if(!p)return;if(!confirm('Lưu trữ đợt trồng này và giữ nguyên lịch sử?'))return;undoDb=structuredClone(db);p.status='Lưu trữ';persist('Đã lưu trữ.',true)}

function saveBlock(e,editId){e.preventDefault();let old=editId?db.blocks.find(x=>x.id===editId):null,type=document.getElementById('bType').value,name=document.getElementById('bName').value.trim(),zone=document.getElementById('bZone').value,len=null,wid=null;if(type==='Chậu tròn'){let d=+document.getElementById('bDiameter').value||null;len=d;wid=d}else if(type==='Chậu vuông'){let d=+document.getElementById('bSide').value||null;len=d;wid=d}else{len=+document.getElementById('bLength').value||null;wid=+document.getElementById('bWidth').value||null}let placement=document.getElementById('bPlacement').value,lock=document.getElementById('bLock').value==='true',xEl=document.getElementById('bX'),yEl=document.getElementById('bY'),xv=xEl?.value??'',yv=yEl?.value??'',manual=xv!==''&&yv!=='',x=manual?+xv:(old?.xCm??null),y=manual?+yv:(old?.yCm??null),rot=((+(document.getElementById('bRot')?.value||old?.rotation||0))%360+360)%360;if((placement==='auto'||placement==='keep'||manual)&&(!len||!wid)){toast('Hãy nhập kích thước trước khi đặt block lên bản đồ.');return}if(placement==='tray'&&!manual){x=null;y=null}let base={id:editId||id('BLK'),name:name||nextBlockName(type),zoneId:zone,type,lengthCm:len,widthCm:wid,xCm:x,yCm:y,rotation:rot,locked:lock,note:document.getElementById('bNote').value.trim(),archived:false,isReferenceGroup:false,createdAt:old?.createdAt||nowISO(),updatedAt:nowISO()};if(base.xCm!=null&&base.yCm!=null){let err=validateGeom(base,editId);if(err){toast(err);return}}undoDb=structuredClone(db);let placedCount=0,failed=0;if(editId){if(placement==='tray'){base.xCm=null;base.yCm=null}else if(placement==='keep'&&!manual){base.xCm=old?.xCm??null;base.yCm=old?.yCm??null}if(base.xCm!=null&&base.yCm!=null){let err=validateGeom(base,editId);if(err){toast(err);undoDb=null;return}}let idx=db.blocks.findIndex(b=>b.id===editId);db.blocks[idx]=base;mapSelected=base.id}else{let qty=Math.min(100,+document.getElementById('bQty').value||1);for(let i=0;i<qty;i++){let item={...base,id:i function rectCorners(b){let a=(b.rotation||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a),hl=(b.lengthCm||0)/2,hw=(b.widthCm||0)/2;return [[-hl,-hw],[hl,-hw],[hl,hw],[-hl,hw]].map(q=>[b.xCm+q[0]*c-q[1]*s,b.yCm+q[0]*s+q[1]*c])}
function polygonsOverlap(a,b){let polys=[a,b];for(let p of polys)for(let i=0;i<p.length;i++){let q=p[(i+1)%p.length],axis=[-(q[1]-p[i][1]),q[0]-p[i][0]],pa=a.map(v=>v[0]*axis[0]+v[1]*axis[1]),pb=b.map(v=>v[0]*axis[0]+v[1]*axis[1]);if(Math.max(...pa)<=Math.min(...pb)||Math.max(...pb)<=Math.min(...pa))return false}return true}
function circleRectOverlap(c,r){let a=-(r.rotation||0)*Math.PI/180,dx=c.xCm-r.xCm,dy=c.yCm-r.yCm,ca=Math.cos(a),sa=Math.sin(a),lx=dx*ca-dy*sa,ly=dx*sa+dy*ca,hl=(r.lengthCm||0)/2,hw=(r.widthCm||0)/2,qx=Math.max(-hl,Math.min(hl,lx)),qy=Math.max(-hw,Math.min(hw,ly)),rx=(c.widthCm||c.lengthCm||0)/2;return (lx-qx)**2+(ly-qy)**2<rx**2}
function blocksOverlap(a,b){let sa=blockShape(a),sb=blockShape(b);if(sa==='circle'&&sb==='circle'){let ra=(a.widthCm||a.lengthCm||0)/2,rb=(b.widthCm||b.lengthCm||0)/2;return Math.hypot(a.xCm-b.xCm,a.yCm-b.yCm)<ra+rb}if(sa==='circle')return circleRectOverlap(a,b);if(sb==='circle')return circleRectOverlap(b,a);return polygonsOverlap(rectCorners(a),rectCorners(b))}
function validateGeom(b,skip){if(b.xCm==null||b.yCm==null||!b.lengthCm||!b.widthCm)return '';if(blockShape(b)==='circle'){let r=(b.widthCm||b.lengthCm)/2;if(b.xCm-r<0)return 'Tâm chậu đang cách mốc 0 m '+Math.round(b.xCm)+' cm nhưng bán kính là '+Math.round(r)+' cm. Hãy kéo tâm vào trong ít nhất '+Math.round(r)+' cm.';if(b.xCm+r>db.garden.lengthCm)return 'Chậu tròn vượt mép cuối vườn. Tâm phải cách mép ít nhất '+Math.round(r)+' cm.';if(b.yCm-r<0)return 'Chậu tròn vượt mép trên. Tâm phải cách mép ít nhất '+Math.round(r)+' cm.';if(b.yCm+r>db.garden.widthCm)return 'Chậu tròn vượt mép dưới. Tâm phải cách mép ít nhất '+Math.round(r)+' cm.'}else{let pts=rectCorners(b);if(pts.some(p=>p[0]<0||p[0]>db.garden.lengthCm||p[1]<0||p[1]>db.garden.widthCm))return 'Block vượt ranh giới vườn. Tọa độ đang tính tại TÂM block; hãy kéo block vào trong thêm hoặc giảm kích thước/góc xoay.'}for(let o of db.blocks){if(o.id===skip||o.archived||o.isReferenceGroup||o.type==='Nhóm tham chiếu'||o.xCm==null||o.yCm==null||!o.lengthCm||!o.widthCm)continue;if(blocksOverlap(b,o))return 'Block chồng lấn với '+o.name+'. Hãy kéo sang vị trí khác.'}return ''}

function exportData(){let payload={app:'Garden Manager',version:'1.0',exportedAt:nowISO(),data:db};downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),'garden-manager-v1.0-backup-'+TODAY+'.json');toast('Đã tạo bản sao lưu JSON.')}
function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreFileChanged(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!d.garden||!d.zones||!d.catalog||!d.blocks||!d.plantings||!d.activities)throw new Error('Thiếu cấu trúc dữ liệu bắt buộc');if(String(x.version||d.version)!=='1.0')throw new Error('Phiên bản không phải 1.0');let errs=[];if(!Number.isFinite(+d.garden.lengthCm)||!Number.isFinite(+d.garden.widthCm))errs.push('Kích thước vườn không hợp lệ');if(errs.length)throw new Error(errs.join('; '));if(!confirm('Tệp hợp lệ. Ứng dụng sẽ tải bản sao lưu hiện tại trước, sau đó thay dữ liệu bằng bản khôi phục. Tiếp tục?'))return;exportData();db=d;localStorage.setItem(STORE,JSON.stringify(db));render();toast('Đã khôi phục dữ liệu.')}catch(err){alert('Không thể khôi phục: '+err.message)}finally{e.target.value=''}};r.readAsText(f)}
function showHistoryBlock(i){showHistory('block',i)}
function toast(msg,undo){let el=document.getElementById('toast');el.innerHTML=escapeHtml(msg)+(undo&&undoDb?'<button onclick="undoLast()">Hoàn tác</button>':'');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),undo?7000:3200)}function undoLast(){if(!undoDb)return;db=undoDb;undoDb=null;localStorage.setItem(STORE,JSON.stringify(db));render();toast('Đã hoàn tác.')}
render();
let deferredInstallPrompt=null;
async function installApp(){if(!deferredInstallPrompt){alert('Android: mở menu Chrome → Cài ứng dụng/Thêm vào màn hình chính. Trên iPhone: Safari → Chia sẻ → Thêm vào Màn hình chính.');return}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null}
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event});
window.addEventListener('appinstalled',()=>{toast('Đã cài Garden Manager.')});
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script></body></html>
