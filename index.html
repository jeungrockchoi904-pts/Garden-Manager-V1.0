function openPlant(existing){let p=existing?db.plantings.find(x=>x.id===existing):null;let opts=db.catalog.filter(c=>!c.archived).map(c=>'<option value="'+c.id+'" '+(p?.catalogId===c.id?'selected':'')+'>'+escapeHtml(c.kind+' · '+c.variety)+'</option>').join('');let bopts=db.blocks.filter(b=>b.archived!==true).map(b=>'<option value="'+b.id+'" '+(p?.blockId===b.id?'selected':'')+'>'+escapeHtml(b.name+' — '+zoneName(b.zoneId))+'</option>').join('');let a=p?.planted||{};openModal(p?'Sửa đợt trồng':'Thêm cây trồng','<form onsubmit="savePlant(event,\''+(p?.id||'')+'\')"><div class="form-grid"><div class="field full"><label>Loại cây · giống (bắt buộc)</label><select id="pCatalog" required><option value="">Chọn cây hoặc giống</option>'+opts+'</select><button type="button" class="btn small" style="margin-top:5px" onclick="openCatalog()">+ Thêm giống mới</button></div><div class="field"><label>Block / chậu</label><select id="pBlock"><option value="">Chưa gán vị trí</option>'+bopts+'</select></div><div class="field"><label>Số cây</label><input id="pCount" type="number" value="'+(p?.count||1)+'" min="1" step="1"></div><div class="field"><label>Nguồn cây</label><select id="pSource"><option>Không rõ</option>'+['Hạt','Cây giống','Giâm cành','Chiết/ghép'].map(v=>'<option '+(p?.source===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="field"><label>Tình trạng</label><select id="pCondition">'+['Bình thường','Cần theo dõi','Có vấn đề'].map(v=>'<option '+((p?.condition||'Bình thường')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="field"><label>Ngày gieo</label><input id="pSowDate" type="date" value="'+(p?.sown?.date||'')+'"></div><div class="field"><label>Độ chính xác ngày gieo</label><select id="pSowAcc">'+sowAccuracyOptions(p?.sown?.accuracy||'exact')+'</select></div><div class="field"><label>Ngày trồng / bắt đầu khoảng</label><input id="pDate" type="date" value="'+(a.date||'')+'"></div><div class="field"><label>Ngày kết thúc khoản function savePlant(e,editId){e.preventDefault();let cat=document.getElementById('pCatalog').value;if(!cat){toast('Hãy chọn loại cây hoặc giống.');return}let date=document.getElementById('pDate').value,acc=document.getElementById('pAcc').value,month=document.getElementById('pMonth').value,age=document.getElementById('pAge').value.trim();let planted={date:date||null,accuracy:acc,month:null,year:null,endDate:null,age:age||null};if(acc==='unknown'){planted.date=null;planted.month=null}if(acc==='month'){if(!month&&date)month=date.slice(0,7);if(!month){toast('Nhập tháng/năm hoặc chọn Không rõ.');return}planted.date=null;planted.month=month}if(acc==='year'){let y=(document.getElementById('pYear')?.value||'').trim()||(date?date.slice(0,4):'');if(!/^20[0-9]{2}$/.test(y)){toast('Nhập năm 4 chữ số hoặc chọn Không rõ.');return}planted.date=null;planted.month=null;planted.year=y}if(acc==='range'){planted.endDate=document.getElementById('pEndDate')?.value||null;if(!date||!planted.endDate){toast('Nhập ngày bắt đầu và kết thúc của khoảng.');return}if(planted.endDate<date){toast('Ngày kết thúc phải sau ngày bắt đầu.');return}}let sowd=document.getElementById('pSowDate').value,sowacc=document.getElementById('pSowAcc').value;let sow={date:sowd||null,accuracy:sowacc};if(sowacc==='unknown')sow.date=null;let old=editId&&db.plantings.find(x=>x.id===editId);undoDb=structuredClone(db);let obj={id:old?.id||id('PLT'),catalogId:cat,blockId:document.getElementById('pBlock').value||null,count:+document.getElementById('pCount').value||1,source:document.getElementById('pSource').value,condition:document.getElementById('pCondition').value,status:old?.status||'Đang trồng',planted:planted,sown:sow,note:document.getElementById('pNote').value.trim(),createdAt:old?.createdAt||nowISO(),updatedAt:nowISO()};if(old)Object.assign(old,obj);else db.plantings.push(obj);db.audit.push({at:nowISO(),action:old?'Sửa đợt trồng':'Tạo đợt trồng',target:obj.id});closeModal();persist(old?'Đã cập nhật cây trồng.':'Đã lưu function saveBlock(e,editId){e.preventDefault();let old=editId?db.blocks.find(x=>x.id===editId):null,type=document.getElementById('bType').value,name=document.getElementById('bName').value.trim(),zone=document.getElementById('bZone').value,len=null,wid=null;if(type==='Chậu tròn'){let d=+document.getElementById('bDiameter').value||null;len=d;wid=d}else if(type==='Chậu vuông'){let d=+document.getElementById('bSide').value||null;len=d;wid=d}else{len=+document.getElementById('bLength').value||null;wid=+document.getElementById('bWidth').value||null}let placement=document.getElementById('bPlacement').value,lock=document.getElementById('bLock').value==='true',xEl=document.getElementById('bX'),yEl=document.getElementById('bY'),xv=xEl?.value??'',yv=yEl?.value??'',manual=xv!==''&&yv!=='',x=manual?+xv:(old?.xCm??null),y=manual?+yv:(old?.yCm??null),rot=((+(document.getElementById('bRot')?.value||old?.rotation||0))%360+360)%360;if((placement==='auto'||placement==='keep'||manual)&&(!len||!wid)){toast('Hãy nhập kích thước trước khi đặt block lên bản đồ.');return}if(placement==='tray'&&!manual){x=null;y=null}let base={id:editId||id('BLK'),name:name||nextBlockName(type),zoneId:zone,type,lengthCm:len,widthCm:wid,xCm:x,yCm:y,rotation:rot,locked:lock,note:document.getElementById('bNote').value.trim(),archived:false,isReferenceGroup:false,createdAt:old?.createdAt||nowISO(),updatedAt:nowISO()};if(base.xCm!=null&&base.yCm!=null){let err=validateGeom(base,editId);if(err){toast(err);return}}undoDb=structuredClone(db);let placedCount=0,failed=0;if(editId){if(placement==='tray'){base.xCm=null;base.yCm=null}else if(placement==='keep'&&!manual){base.xCm=old?.xCm??null;base.yCm=old?.yCm??null}if(base.xCm!=null&&base.yCm!=null){let err=validateGeom(base,editId);if(err){toast(err);undoDb=null;return}}let idx=db.blocks.findIndex(b=>b.id===editId);db.blocks[idx]=base;mapSelected=base.id}else{let qty=Math.min(100,+document.getElementById('bQty').value||1);for(let i=0;i<qty;i++){let item={...base,id:i function rectCorners(b){let a=(b.rotation||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a),hl=(b.lengthCm||0)/2,hw=(b.widthCm||0)/2;return [[-hl,-hw],[hl,-hw],[hl,hw],[-hl,hw]].map(q=>[b.xCm+q[0]*c-q[1]*s,b.yCm+q[0]*s+q[1]*c])}
function polygonsOverlap(a,b){let polys=[a,b];for(let p of polys)for(let i=0;i<p.length;i++){let q=p[(i+1)%p.length],axis=[-(q[1]-p[i][1]),q[0]-p[i][0]],pa=a.map(v=>v[0]*axis[0]+v[1]*axis[1]),pb=b.map(v=>v[0]*axis[0]+v[1]*axis[1]);if(Math.max(...pa)<=Math.min(...pb)||Math.max(...pb)<=Math.min(...pa))return false}return true}
function circleRectOverlap(c,r){let a=-(r.rotation||0)*Math.PI/180,dx=c.xCm-r.xCm,dy=c.yCm-r.yCm,ca=Math.cos(a),sa=Math.sin(a),lx=dx*ca-dy*sa,ly=dx*sa+dy*ca,hl=(r.lengthCm||0)/2,hw=(r.widthCm||0)/2,qx=Math.max(-hl,Math.min(hl,lx)),qy=Math.max(-hw,Math.min(hw,ly)),rx=(c.widthCm||c.lengthCm||0)/2;return (lx-qx)**2+(ly-qy)**2<rx**2}
function blocksOverlap(a,b){let sa=blockShape(a),sb=blockShape(b);if(sa==='circle'&&sb==='circle'){let ra=(a.widthCm||a.lengthCm||0)/2,rb=(b.widthCm||b.lengthCm||0)/2;return Math.hypot(a.xCm-b.xCm,a.yCm-b.yCm)<ra+rb}if(sa==='circle')return circleRectOverlap(a,b);if(sb==='circle')return circleRectOverlap(b,a);return polygonsOverlap(rectCorners(a),rectCorners(b))}
function validateGeom(b,skip){if(b.xCm==null||b.yCm==null||!b.lengthCm||!b.widthCm)return '';if(blockShape(b)==='circle'){let r=(b.widthCm||b.lengthCm)/2;if(b.xCm-r<0)return 'Tâm chậu đang cách mốc 0 m '+Math.round(b.xCm)+' cm nhưng bán kính là '+Math.round(r)+' cm. Hãy kéo tâm vào trong ít nhất '+Math.round(r)+' cm.';if(b.xCm+r>db.garden.lengthCm)return 'Chậu tròn vượt mép cuối vườn. Tâm phải cách mép ít nhất '+Math.round(r)+' cm.';if(b.yCm-r<0)return 'Chậu tròn vượt mép trên. Tâm phải cách mép ít nhất '+Math.round(r)+' cm.';if(b.yCm+r>db.garden.widthCm)return 'Chậu tròn vượt mép dưới. Tâm phải cách mép ít nhất '+Math.round(r)+' cm.'}else{let pts=rectCorners(b);if(pts.some(p=>p[0]<0||p[0]>db.garden.lengthCm||p[1]<0||p[1]>db.garden.widthCm))return 'Block vượt ranh giới vườn. Tọa độ đang tính tại TÂM block; hãy kéo block vào trong thêm hoặc giảm kích thước/góc xoay.'}for(let o of db.blocks){if(o.id===skip||o.archived||o.isReferenceGroup||o.type==='Nhóm tham chiếu'||o.xCm==null||o.yCm==null||!o.lengthCm||!o.widthCm)continue;if(blocksOverlap(b,o))return 'Block chồng lấn với '+o.name+'. Hãy kéo sang vị trí khác.'}return ''}

function runChecks(){let out=[],ids={};for(let b of db.blocks){if(ids[b.id])out.push({level:'Lỗi',text:'Mã block trùng: '+b.id});ids[b.id]=1;if(b.xCm!=null&&b.yCm!=null){let e=validateGeom(b,b.id);if(e)out.push({level:'Lỗi',text:b.name+': '+e})}if(!b.lengthCm||!b.widthCm)out.push({level:'Cần xem',text:b.name+': chưa có kích thước'})}for(let p of db.plantings){if(p.blockId&&!db.blocks.some(b=>b.id===p.blockId))out.push({level:'Lỗi',text:'Cây '+p.id+' liên kết đến block không tồn tại.'});if(p.catalogId&&!db.catalog.some(c=>c.id===p.catalogId))out.push({level:'Lỗi',text:'Cây '+p.id+' liên kết đến loại cây không tồn tại.'});if(p.sown?.date&&p.planted?.date&&p.sown.date>p.planted.date)out.push({level:'Cần xem',text:'Ngày gieo sau ngày trồng: '+cropName(p.id)})}return out}

function exportData(){let payload={app:'Garden Manager',version:'1.0',exportedAt:nowISO(),data:db};downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),'garden-manager-v1.0-backup-'+TODAY+'.json');toast('Đã tạo bản sao lưu JSON.')}
function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreFileChanged(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!d.garden||!d.zones||!d.catalog||!d.blocks||!d.plantings||!d.activities)throw new Error('Thiếu cấu trúc dữ liệu bắt buộc');if(String(x.version||d.version)!=='1.0')throw new Error('Phiên bản không phải 1.0');let errs=[];if(!Number.isFinite(+d.garden.lengthCm)||!Number.isFinite(+d.garden.widthCm))errs.push('Kích thước vườn không hợp lệ');if(errs.length)throw new Error(errs.join('; '));if(!confirm('Tệp hợp lệ. Ứng dụng sẽ tải bản sao lưu hiện tại trước, sau đó thay dữ liệu bằng bản khôi phục. Tiếp tục?'))return;exportData();db=d;localStorage.setItem(STORE,JSON.stringify(db));render();toast('Đã khôi phục dữ liệu.')}catch(err){alert('Không thể khôi phục: '+err.message)}finally{e.target.value=''}};r.readAsText(f)}
function showHistoryBlock(i){showHistory('block',i)}
function toast(msg,undo){let el=document.getElementById('toast');el.innerHTML=escapeHtml(msg)+(undo&&undoDb?'<button onclick="undoLast()">Hoàn tác</button>':'');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),undo?7000:3200)}function undoLast(){if(!undoDb)return;db=undoDb;undoDb=null;localStorage.setItem(STORE,JSON.stringify(db));render();toast('Đã hoàn tác.')}
render();if(page==='settings')renderCatalog();
let deferredInstallPrompt=null;
const installButton=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;installButton.classList.remove('hide')});
installButton.addEventListener('click',async()=>{if(!deferredInstallPrompt){alert('Trên iPhone: mở Chia sẻ trong Safari rồi chọn Thêm vào MH chính.');return}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installButton.classList.add('hide')});
window.addEventListener('appinstalled',()=>{installButton.classList.add('hide');toast('Đã cài Garden Manager.')});
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script></body></html>
