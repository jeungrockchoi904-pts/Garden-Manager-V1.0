<style>

.map-aside{display:flex;flex-direction:column;gap:12px}.map-aside .card{box-shadow:none}.unknown-list{max-height:240px;overflow:auto}.unknown-item{padding:8px 0;border-bottom:1px solid #edf1ed;font-size:13px}.unknown-item:last-child{border:0}.schema{width:100%;height:auto;border-radius:10px;border:1px solid var(--line)}.note{border-left:3px solid #83aa8b;background:#f4f9f4;padding:10px 12px;border-radius:0 9px 9px 0;color:#516257;font-size:13px}.zone-list{display:grid;gap:8px}.zone-card{display:flex;align-items:center;justify-content:space-between;padding:10px;border:1px solid var(--line);border-radius:10px}.timeline{display:grid;gap:10px}.event{border-left:2px solid #a9c8ae;padding:0 0 8px 12px}.event strong{font-size:13px}.event small{color:var(--muted)}.modal-back{position:fixed;inset:0;background:#10241bb0;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal-back.show{display:flex}.modal{background:white;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:18px;box-shadow:0 20px 70px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h3{margin:0;color:var(--ink)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#183b32;color:white;border-radius:12px;padding:11px 15px;box-shadow:var(--shadow);z-index:15;display:none}.toast.show{display:flex;gap:12px;align-items:center}.toast button{background:none;border:0;color:#d9f4c5;text-decoration:underline;font-weight:700}.smalltext{font-size:12px}.mobile-nav{display:none}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:white;border-radius:20px;padding:6px 10px;font-size:13px}.tabs button.active{background:var(--ink);color:white;border-color:var(--ink)}.danger-zone{border function initMapDrag(){let svg=document.querySelector('.map-window svg');if(!svg)return;let drag=null;function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}svg.addEventListener('pointerdown',e=>{let g=e.target.closest('[data-block-id]');if(!g)return;let b=db.blocks.find(x=>x.id===g.getAttribute('data-block-id'));if(!b)return;if(b.locked){openBlock(b.id);return}e.preventDefault();let p=point(e);drag={id:b.id,dx:p.x-b.yCm,dy:p.y-(b.xCm-mapStart),g:g};g.setPointerCapture(e.pointerId);g.style.cursor='grabbing'});svg.addEventListener('pointermove',e=>{if(!drag)return;let p=point(e),yy=Math.max(0,Math.min(db.garden.widthCm,Math.round(p.x-drag.dx))),xx=Math.max(0,Math.min(db.garden.lengthCm,Math.round(mapStart+p.y-drag.dy))),b=db.blocks.find(x=>x.id===drag.id);drag.next={x:xx,y:yy};drag.g.setAttribute('transform','translate('+yy+' '+(xx-mapStart)+') rotate('+(-(b.rotation||0))+')')});svg.addEventListener('pointerup',()=>{if(!drag)return;let b=db.blocks.find(x=>x.id===drag.id),next=drag.next;drag.g.style.cursor='grab';if(!next){let i=drag.id;drag=null;openBlock(i);return}let moved={...b,xCm:next.x,yCm:next.y},err=validateGeom(moved,b.id);if(err){drag=null;render();toast(err);return}undoDb=structuredClone(db);b.xCm=next.x;b.yCm=next.y;b.isReferenceGroup=false;b.updatedAt=nowISO();db.audit.push({at:nowISO(),action:'Di chuyển block',target:b.id});localStorage.setItem(STORE,JSON.stringify(db));drag=null;render();toast('Đã đặt vị trí block.',true)});svg.addEventListener('pointercancel',()=>{drag=null;render()})}

function openPlant(existing){let p=existing?db.plantings.find(x=>x.id===existing):null;let opts=db.catalog.filter(c=>!c.archived).map(c=>'<option value="'+c.id+'" '+(p?.catalogId===c.id?'selected':'')+'>'+escapeHtml(c.kind+' · '+c.variety)+'</option>').join('');let bopts=db.blocks.filter(b=>b.archived!==true).map(b=>'<option value="'+b.id+'" '+(p?.blockId===b.id?'selected':'')+'>'+escapeHtml(b.name+' — '+zoneName(b.zoneId))+'</option>').join('');let a=p?.planted||{};openModal(p?'Sửa đợt trồng':'Thêm cây trồng','<form onsubmit="savePlant(event,\''+(p?.id||'')+'\')"><div class="form-grid"><div class="field full"><label>Loại cây · giống (bắt buộc)</label><select id="pCatalog" required><option value="">Chọn cây hoặc giống</option>'+opts+'</select><button type="button" class="btn small" style="margin-top:5px" onclick="openCatalog()">+ Thêm giống mới</button></div><div class="field"><label>Block / chậu</label><select id="pBlock"><option value="">Chưa gán vị trí</option>'+bopts+'</select></div><div class="field"><label>Số cây</label><input id="pCount" type="number" value="'+(p?.count||1)+'" min="1" step="1"></div><div class="field"><label>Nguồn cây</label><select id="pSource"><option>Không rõ</option>'+['Hạt','Cây giống','Giâm cành','Chiết/ghép'].map(v=>'<option '+(p?.source===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="field"><label>Tình trạng</label><select id="pCondition">'+['Bình thường','Cần theo dõi','Có vấn đề'].map(v=>'<option '+((p?.condition||'Bình thường')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="field"><label>Ngày gieo</label><input id="pSowDate" type="date" value="'+(p?.sown?.date||'')+'"></div><div class="field"><label>Độ chính xác ngày gieo</label><select id="pSowAcc">'+sowAccuracyOptions(p?.sown?.accuracy||'exact')+'</select></div><div class="field"><label>Ngày trồng / bắt đầu khoảng</label><input id="pDate" type="date" value="'+(a.date||'')+'"></div><div class="field"><label>Ngày kết thúc khoảng (nếu chọn Khoảng ngày)</label><input id="pEndDate" type="date" value="'+(a.endDate||'')+'"></div><div class="field"><label>Độ chính xác ngày trồng</label><select id="pAcc">'+accuracyOptions(a.accuracy||'unknown',!!a.date)+'</select></div><div class="field"><label>Tháng/năm nếu chỉ nhớ tháng</label><input id="pMonth" type="month" value="'+(a.month||'')+'"></div><div class="field"><label>Năm nếu chỉ nhớ năm</label><input id="pYear" inputmode="numeric" maxlength="4" placeholder="2025" value="'+(a.year||'')+'"></div><div class="field"><label>Tuổi ước tính</label><input id="pAge" placeholder="Ví dụ: khoảng 2–3 năm" value="'+escapeHtml(a.age||'')+'"></div><div class="field full"><label>Ghi chú</label><textarea id="pNote">'+escapeHtml(p?.note||'')+'</textarea></div></div><p class="note">Không nhập ngày giả. Chọn “Không rõ” nếu không nhớ ngày; tuổi ước tính được lưu riêng.</p><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Lưu cây</button></div></form>')}

function accuracyOptions(sel,has){return [['exact','Chính xác'],['range','Khoảng ngày'],['month','Chỉ biết tháng/năm'],['year','Chỉ biết năm'],['unknown','Không rõ']].map(x=>'<option value="'+x[0]+'" '+(sel===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')}
function savePlant(e,editId){e.preventDefault();let cat=document.getElementById('pCatalog').value;if(!cat){toast('Hãy chọn loại cây hoặc giống.');return}let date=document.getElementById('pDate').value,acc=document.getElementById('pAcc').value,month=document.getElementById('pMonth').value,age=document.getElementById('pAge').value.trim();let planted={date:date||null,accuracy:acc,month:null,year:null,endDate:null,age:age||null};if(acc==='unknown'){planted.date=null;planted.month=null}if(acc==='month'){if(!month&&date)month=date.slice(0,7);if(!month){toast('Nhập tháng/năm hoặc chọn Không rõ.');return}planted.date=null;planted.month=month}if(acc==='year'){let y=(document.getElementById('pYear')?.value||'').trim()||(date?date.slice(0,4):'');if(!/^20[0-9]{2}$/.test(y)){toast('Nhập năm 4 chữ số hoặc chọn Không rõ.');return}planted.date=null;planted.month=null;planted.year=y}if(acc==='range'){planted.endDate=document.getElementById('pEndDate')?.value||null;if(!date||!planted.endDate){toast('Nhập ngày bắt đầu và kết thúc của khoảng.');return}if(planted.endDate<date){toast('Ngày kết thúc phải sau ngày bắt đầu.');return}}let sowd=document.getElementById('pSowDate').value,sowacc=document.getElementById('pSowAcc').value;let sow={date:sowd||null,accuracy:sowacc};if(sowacc==='unknown')sow.date=null;let old=editId&&db.plantings.find(x=>x.id===editId);undoDb=structuredClone(db);let obj={id:old?.id||id('PLT'),catalogId:cat,blockId:document.getElementById('pBlock').value||null,count:+document.getElementById('pCount').value||1,source:document.getElementById('pSource').value,condition:document.getElementById('pCondition').value,status:old?.status||'Đang trồng',planted:planted,sown:sow,note:document.getElementById('pNote').value.trim(),createdAt:old?.createdAt||nowISO(),updatedAt:nowISO()};if(old)Object.assign(old,obj);else db.plantings.push(obj);db.audit.push({at:nowISO(),action:old?'Sửa đợt trồng':'Tạo đợt trồng',target:obj.id});closeModal();persist(old?'Đã cập nhật cây trồng.':'Đã lưu cây trồng.',true)}

function endPlantAsk(i){let p=db.plantings.find(x=>x.id===i);let linked=db.activities.some(a=>a.plantingId===i);openModal('Kết thúc / lưu trữ đợt trồng','<div class="field"><label>Đợt trồng</label><input value="'+escapeHtml(cropName(i))+'" disabled></div><div class="field"><label>Lý do kết thúc</label><select id="endReason">'+['Thu hoạch xong','Cây chết','Sâu bệnh','Thay cây','Chuyển vị trí','Khác'].map(v=>'<option>'+v+'</option>').join('')+'</select></div><div class="field"><label>Ngày kết thúc</label><input type="date" id="endDate" value="'+TODAY+'"></div><p class="note">Nhật ký liên quan: '+(linked?'có — sẽ được giữ lại.':'chưa có')+' Block sẽ trở về trạng thái trống.</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn danger" onclick="confirmEnd(\''+i+'\')">Kết thúc đợt trồng</button></div>')}

function archivePlant(i){let p=db.plantings.find(x=>x.id===i);if(!p)return;if(!confirm('Lưu trữ đợt trồng này và giữ nguyên lịch sử?'))return;undoDb=structuredClone(db);p.status='Lưu trữ';persist('Đã lưu trữ.',true)}
function deletePlant(i){let linked=db.activities.some(a=>a.plantingId===i);if(linked){endPlantAsk(i);return}if(!confirm('Xóa vĩnh viễn mục mới tạo này?'))return;undoDb=structuredClone(db);db.plantings=db.plantings.filter(p=>p.id!==i);persist('Đã xóa mục chưa có nhật ký.')}
function openBlock(existing){let b=existing?db.blocks.find(x=>x.id===existing):null;let zones=db.zones.map(z=>'<option value="'+z.id+'" '+(b?.zoneId===z.id?'selected':'')+'>'+escapeHtml(z.name)+'</option>').join('');openModal(b?'Sửa block':'Thêm chậu / luống','<form onsubmit="saveBlock(event,\''+(b?.id||'')+'\')"><div class="form-grid"><div class="field"><label>Tên / mã block</label><input id="bName" value="'+escapeHtml(b?.name||'')+'" placeholder="Tự tạo mã khi để trống"></div><div class="field"><label>Khu</label><select id="bZone">'+zones+'</select></div><div class="field"><label>Loại vật thể</label><select id="bType">'+['Chậu tròn','Chậu chữ nhật','Chậu vuông','Luống','Bồn','Túi trồng','Trồng trực tiếp','Giàn','Nhóm tham chiếu','Khác'].map(v=>'<option '+(b?.type===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="field"><label>Số lượng giống nhau</label><input id="bQty" type="number" min="1" value="1"></div><div class="field"><label>Dài theo trục vườn (cm)</label><input id="bLength" type="number" step="1" min="1" value="'+(b?.lengthCm||'')+'" placeholder="Chưa đo"></div><div class="field"><label>Rộng theo bề ngang (cm)</label><input id="bWidth" type="number" step="1" min="1" value="'+(b?.widthCm||'')+'" placeholder="Chưa đo"></div><div class="field"><label>X từ đầu 0 m (cm)</label><input id="bX" type="number" step="1" min="0" max="'+db.garden.lengthCm+'" value="'+(b?.xCm??'')+'" placeholder="Để trống nếu chưa định vị"></div><div class="field"><label>Y từ mép ngang (cm)</label><input id="bY" type="number" step="1" min="0" max="'+db.garden.widthCm+'" value="'+(b?.yCm??'')+'" placeholder="Để trống nếu chưa định vị"></div><div class="field"><label>Góc xoay (độ)</label><input id="bRot" type="number" step="1" value="'+(b?.rotation||0)+'"></div><div class="field"><label>Trạng thái tọa độ</label><select id="bPrecision"><option value="1">Đã đo / tọa độ chính xác</option><option value="0" '+(b?.xCm==null?'selected':'')+'>Chưa đo / chưa định vị</option></select></div><div class="field"><label>Khóa vị trí</label><select id="bLock"><option value="false">Chưa khóa</option><option value="true" '+(b?.locked?'selected':'')+'>Đã khóa</option></select></div><div class="field"><label>Ghi chú</label><input id="bNote" value="'+escapeHtml(b?.note||'')+'"></div></div><p class="note">Tọa độ X/Y và kích thước nhập theo cm, độ phân giải 1 cm. Điểm X/Y là tâm block. Chưa đo thì để trống; không lấy tỷ lệ ảnh để suy ra.</p><div class="modal-actions">'+(b?'<button type="button" class="btn danger" onclick="deleteBlock(\''+b.id+'\')">Xóa / lưu trữ</button>':'')+'<button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Lưu block</button></div></form>')}
function editBlock(i){openBlock(i)}
function saveBlock(e,editId){e.preventDefault();let name=document.getElementById('bName').value.trim(),zone=document.getElementById('bZone').value,len=+document.getElementById('bLength').value||null,wid=+document.getElementById('bWidth').value||null,xv=document.getElementById('bX').value,yv=document.getElementById('bY').value;let known=document.getElementById('bPrecision').value==='1'&&xv!==''&&yv!=='';let x=known?+xv:null,y=known?+yv:null;if(known&&(!len||!wid)){toast('Cần nhập kích thước block trước khi đặt tọa độ.');return}if(known&&(x<0||x>db.garden.lengthCm||y<0||y>db.garden.widthCm)){toast('Tọa độ nằm ngoài ranh vườn.');return}let rot=((+document.getElementById('bRot').value||0)%360+360)%360;let obj={id:editId||id('BLK'),name:name||nextBlockName(document.getElementById('bType').value),zoneId:zone,type:document.getElementById('bType').value,lengthCm:len,widthCm:wid,xCm:x,yCm:y,rotation:rot,locked:document.getElementById('bLock').value==='true',note:document.getElementById('bNote').value.trim(),archived:false,createdAt:editId?(db.blocks.find(b=>b.id===editId)?.createdAt||nowISO()):nowISO()};if(known){let err=validateGeom(obj,editId);if(err){toast(err);return}}undoDb=structuredClone(db);if(editId){let i=db.blocks.findIndex(b=>b.id===editId);db.blocks[i]=obj}else{let qty=Math.min(100,+document.getElementById('bQty').value||1);for(let i=0;i<qty;i++)db.blocks.push({...obj,id:id('BLK'),name:qty>1?(name?obj.name+'-'+String(i+1).padStart(2,'0'):nextBlockName(obj.type)):obj.name,xCm:known&&qty===1?x:null,yCm:known&&qty===1?y:null})}closeModal();persist('Đã lưu block.')}
function rectCorners(b){let a=(b.rotation||0)*Math.PI/180,c=Math.cos(a),s=Math.sin(a),hl=(b.lengthCm||0)/2,hw=(b.widthCm||0)/2;return [[-hl,-hw],[hl,-hw],[hl,hw],[-hl,hw]].map(q=>[b.xCm+q[0]*c-q[1]*s,b.yCm+q[0]*s+q[1]*c])}
function validateGeom(b,skip){let pts=rectCorners(b);if(pts.some(p=>p[0]<0||p[0]>db.garden.lengthCm||p[1]<0||p[1]>db.garden.widthCm))return 'Block vượt ranh giới vườn; kiểm tra tọa độ, kích thước hoặc góc xoay.';for(let o of db.blocks){if(o.id===skip||o.archived||o.xCm==null||o.yCm==null)continue;if(polygonsOverlap(pts,rectCorners(o)))return 'Block chồng lấn với '+o.name+'. Chỉnh vị trí hoặc kích thước trước khi lưu.'}return ''}
function polygonsOverlap(a,b){let polys=[a,b];for(let p of polys)for(let i=0;i<p.length;i++){let q=p[(i+1)%p.length],axis=[-(q[1]-p[i][1]),q[0]-p[i][0]],pa=a.map(v=>v[0]*axis[0]+v[1]*axis[1]),pb=b.map(v=>v[0]*axis[0]+v[1]*axis[1]);if(Math.max(...pa)<Math.min(...pb)||Math.max(...pb)<Math.min(...pa))return false}return true}
function deleteBlock(i){let b=db.blocks.find(x=>x.id===i),linked=db.plantings.some(p=>p.blockId===i)||db.activities.some(a=>a.blockId===i);if(linked){if(!confirm('Block có dữ liệu liên kết. Lưu trữ để giữ lịch sử?'))return;b.archived=true;closeModal();persist('Đã lưu trữ block và giữ dữ liệu liên kết.')}else if(confirm('Xóa block chưa liên kết?')){db.blocks=db.blocks.filter(x=>x.id!==i);closeModal();persist('Đã xóa block.')}}
function openActivity(){let opts=['Chăm sóc','Sâu bệnh','Thu hoạch','Ảnh','Thay đổi'];openModal('Thêm hoạt động','<form onsubmit="saveActivity(event)"><div class="form-grid"><div class="field"><label>Loại hoạt động</label><select id="aType">'+opts.map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label>Ngày giờ</label><input id="aDate" type="datetime-local" value="'+new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)+'"></div><div class="field full"><label>Tiêu đề</label><input id="aTitle" required placeholder="Ví dụ: Tưới nước, phát hiện rệp sáp"></div><div class="field"><label>Cây</label><select id="aPlant"><option value="">Toàn vườn / không gán</option>'+activePlants().map(p=>'<option value="'+p.id+'">'+escapeHtml(cropName(p.id))+'</option>').join('')+'</select></div><div class="field"><label>Block</label><select id="aBlock"><option value="">Không gán</option>'+db.blocks.map(b=>'<option value="'+b.id+'">'+escapeHtml(b.name)+'</option>').join('')+'</select></div><div class="field full"><label>Nội dung / ghi chú</label><textarea id="aNote"></textarea></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Lưu nhật ký</button></div></form>')}
function saveActivity(e){e.preventDefault();let d=document.getElementById('aDate').value;let a={id:id('ACT'),type:document.getElementById('aType').value,title:document.getElementById('aTitle').value.trim(),note:document.getElementById('aNote').value.trim(),plantingId:document.getElementById('aPlant').value||null,blockId:document.getElementById('aBlock').value||null,createdAt:d?new Date(d).toISOString():nowISO()};db.activities.push(a);db.audit.push({at:nowISO(),action:'Thêm nhật ký',target:a.id});closeModal();persist('Đã lưu hoạt động.')}
function openIssue(){openModal('Ghi nhận sự vụ','<form onsubmit="saveIssue(event)"><div class="form-grid"><div class="field"><label>Loại sự vụ</label><select id="iType"><option>Sâu bệnh</option><option>Thời tiết</option><option>Thiệt hại</option><option>Khác</option></select></div><div class="field"><label>Ngày ghi nhận</label><input id="iDate" type="date" value="'+TODAY+'"></div><div class="field full"><label>Mô tả</label><textarea id="iDesc" required placeholder="Triệu chứng, cây/khu vực bị ảnh hưởng…"></textarea></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Lưu sự vụ</button></div></form>')}
function saveIssue(e){e.preventDefault();let d=document.getElementById('iDate').value;db.activities.push({id:id('ISS'),type:'Sâu bệnh',title:document.getElementById('iType').value,note:document.getElementById('iDesc').value.trim(),createdAt:d?new Date(d+'T12:00:00').toISOString():nowISO()});closeModal();persist('Đã ghi nhận sự vụ.')}
function deleteActivity(i){if(!confirm('Xóa hoạt động khỏi nhật ký?'))return;db.activities=db.activities.filter(a=>a.id!==i);persist('Đã xóa hoạt động.')}
function showHistory(type,i){let a=db.activities.filter(x=>x.plantingId===i||x.blockId===i).sort((x,y)=>y.createdAt.localeCompare(x.createdAt));let logs=db.audit.filter(x=>x.target===i).sort((x,y)=>y.at.localeCompare(x.at));openModal('Lịch sử hoạt động',a.length||logs.length?'<div class="timeline">'+a.map(x=>'<div class="event"><strong>'+escapeHtml(x.title)+'</strong><div>'+escapeHtml(x.note||'')+'</div><small>'+fmtTime(x.createdAt)+'</small></div>').join('')+logs.map(x=>'<div class="event"><strong>'+escapeHtml(x.action)+'</strong><small>'+fmtTime(x.at)+'</small></div>').join('')+'</div>':'<div class="empty">Chưa có lịch sử cho mục này.</div>')}
function openCatalog(existing){let c=existing?db.catalog.find(x=>x.id===existing):null;openModal(c?'Sửa loại cây / giống':'Thêm loại cây / giống','<form onsubmit="saveCatalog(event,\''+(c?.id||'')+'\')"><div class="form-grid"><div class="field"><label>Loại cây</label><input id="cKind" required value="'+escapeHtml(c?.kind||'')+'" placeholder="Ví dụ: Xà lách"></div><div class="field"><label>Giống / loại cụ thể</label><input id="cVariety" required value="'+escapeHtml(c?.variety||'')+'" placeholder="Ví dụ: Sanchu"></div><div class="field"><label>Nhóm</label><select id="cGroup">'+['Cây ăn lá','Rau gia vị','Cây ăn quả','Cây leo','Cây lâu năm','Khác'].map(v=>'<option '+(c?.group===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div></div><div class="modal-actions">'+(c?'<button type="button" class="btn danger" onclick="archiveCatalog(\''+c.id+'\')">Lưu trữ</button>':'')+'<button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Lưu</button></div></form>')}
function saveCatalog(e,edit){e.preventDefault();let kind=document.getElementById('cKind').value.trim(),variety=document.getElementById('cVariety').value.trim(),group=document.getElementById('cGroup').value;let dup=db.catalog.some(c=>!c.archived&&c.kind.toLowerCase()===kind.toLowerCase()&&c.variety.toLowerCase()===variety.toLowerCase()&&c.id!==edit);if(dup){toast('Loại cây và giống này đã có trong thư viện.');return}if(edit){let c=db.catalog.find(x=>x.id===edit);Object.assign(c,{kind,variety,group})}else db.catalog.push({id:id('CAT'),kind,variety,group,archived:false});closeModal();persist('Đã cập nhật thư viện cây.')}
function editCatalog(i){openCatalog(i)}function archiveCatalog(i){if(!confirm('Lưu trữ giống này? Dữ liệu cây trồng cũ vẫn được giữ.'))return;db.catalog.find(c=>c.id===i).archived=true;closeModal();persist('Đã lưu trữ giống.')}
function saveGarden(){let l=+document.getElementById('gLen').value,w=+document.getElementById('gWid').value;if(!l||!w||l<=0||w<=0){toast('Kích thước phải lớn hơn 0.');return}db.garden.name=document.getElementById('gName').value.trim()||'Vườn nhà';db.garden.lengthCm=Math.round(l*100);db.garden.widthCm=Math.round(w*100);persist('Đã lưu thông tin vườn.')}
function openZone(existing){let z=existing?db.zones.find(x=>x.id===existing):null;openModal(z?'Sửa khu':'Thêm khu','<form onsubmit="saveZone(event,\''+(z?.id||'')+'\')"><div class="form-grid"><div class="field"><label>Tên khu</label><input id="zName" required value="'+escapeHtml(z?.name||'')+'"></div><div class="field"><label>Bắt đầu tại (cm) — có thể để trống</label><input id="zStart" type="number" min="0" value="'+(z?.startCm??'')+'"></div><div class="field"><label>Chiều dài khu (cm) — có thể để trống</label><input id="zLen" type="number" min="1" value="'+(z?.lengthCm??'')+'"></div><div class="field"><label>Chiều rộng (cm) — có thể để trống</label><input id="zWidth" type="number" min="1" value="'+(z?.widthCm??'')+'"></div><div class="field full"><label>Ghi chú</label><textarea id="zNote">'+escapeHtml(z?.note||'')+'</textarea></div></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button class="btn primary">Lưu khu</button></div></form>')}
function saveZone(e,edit){e.preventDefault();let obj={id:edit||id('KHU'),name:document.getElementById('zName').value.trim(),startCm:document.getElementById('zStart').value===''?null:+document.getElementById('zStart').value,lengthCm:document.getElementById('zLen').value===''?null:+document.getElementById('zLen').value,widthCm:document.getElementById('zWidth').value===''?null:+document.getElementById('zWidth').value,note:document.getElementById('zNote').value.trim()};if(edit)Object.assign(db.zones.find(x=>x.id===edit),obj);else db.zones.push(obj);closeModal();persist('Đã lưu khu.')}
function editZone(i){openZone(i)}
function runChecks(){let out=[],ids={};for(let b of db.blocks){if(ids[b.id])out.push({level:'Lỗi',text:'Mã block trùng: '+b.id});ids[b.id]=1;if(b.xCm!=null&&b.yCm!=null){let e=validateGeom(b,b.id);if(e)out.push({level:'Lỗi',text:b.name+': '+e})}if(!b.lengthCm||!b.widthCm)out.push({level:'Cần xem',text:b.name+': chưa có kích thước'})}for(let p of db.plantings){if(p.blockId&&!db.blocks.some(b=>b.id===p.blockId))out.push({level:'Lỗi',text:'Cây '+p.id+' liên kết đến block không tồn tại.'});if(p.catalogId&&!db.catalog.some(c=>c.id===p.catalogId))out.push({level:'Lỗi',text:'Cây '+p.id+' liên kết đến loại cây không tồn tại.'});if(p.sown?.date&&p.planted?.date&&p.sown.date>p.planted.date)out.push({level:'Cần xem',text:'Ngày gieo sau ngày trồng: '+cropName(p.id)})}return out}
function runCheckToast(){let c=runChecks();toast(c.length?'Kiểm tra xong: '+c.length+' mục cần xem.':'Kiểm tra xong: không phát hiện lỗi.');render()}
function downloadChecks(){let blob=new Blob([JSON.stringify({checkedAt:nowISO(),results:runChecks()},null,2)],{type:'application/json'});downloadBlob(blob,'garden-manager-data-check.json')}
function exportData(){let payload={app:'Garden Manager',version:'1.0',exportedAt:nowISO(),data:db};downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),'garden-manager-v1.0-backup-'+TODAY+'.json');toast('Đã tạo bản sao lưu JSON.')}
function downloadBlob(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restoreFileChanged(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!d.garden||!d.zones||!d.catalog||!d.blocks||!d.plantings||!d.activities)throw new Error('Thiếu cấu trúc dữ liệu bắt buộc');if(String(x.version||d.version)!=='1.0')throw new Error('Phiên bản không phải 1.0');let errs=[];if(!Number.isFinite(+d.garden.lengthCm)||!Number.isFinite(+d.garden.widthCm))errs.push('Kích thước vườn không hợp lệ');if(errs.length)throw new Error(errs.join('; '));if(!confirm('Tệp hợp lệ. Ứng dụng sẽ tải bản sao lưu hiện tại trước, sau đó thay dữ liệu bằng bản khôi phục. Tiếp tục?'))return;exportData();db=d;localStorage.setItem(STORE,JSON.stringify(db));render();toast('Đã khôi phục dữ liệu.')}catch(err){alert('Không thể khôi phục: '+err.message)}finally{e.target.value=''}};r.readAsText(f)}
function showHistoryBlock(i){showHistory('block',i)}
function toast(msg,undo){let el=document.getElementById('toast');el.innerHTML=escapeHtml(msg)+(undo&&undoDb?'<button onclick="undoLast()">Hoàn tác</button>':'');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),undo?7000:3200)}function undoLast(){if(!undoDb)return;db=undoDb;undoDb=null;localStorage.setItem(STORE,JSON.stringify(db));render();toast('Đã hoàn tác.')}
render();if(page==='settings')renderCatalog();
let deferredInstallPrompt=null;
const installButton=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;installButton.classList.remove('hide')});
installButton.addEventListener('click',async()=>{if(!deferredInstallPrompt){alert('Trên iPhone: mở Chia sẻ trong Safari rồi chọn Thêm vào MH chính.');return}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;installButton.classList.add('hide')});
window.addEventListener('appinstalled',()=>{installButton.classList.add('hide');toast('Đã cài Garden Manager.')});
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
</script></body></html>
