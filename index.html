function dateKey(d){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh'}).format(d)}
function calendarMove(step){let d=new Date(calendarAnchor+'T12:00:00');if(calendarMode==='month')d.setMonth(d.getMonth()+step);else d.setDate(d.getDate()+7*step);calendarAnchor=dateKey(d);render()}
function renderCalendar(){let anchor=new Date(calendarAnchor+'T12:00:00'),nowKey=TODAY,events=db.activities.slice().sort((a,b)=>a.createdAt.localeCompare(b.createdAt));let head='<div class="calendar-toolbar"><div class="tabs"><button class="'+(calendarMode==='week'?'active':'')+'" onclick="calendarMode=\'week\';render()">Tuần</button><button class="'+(calendarMode==='month'?'active':'')+'" onclick="calendarMode=\'month\';render()">Tháng</button></div><div class="row"><button class="btn small" onclick="calendarMove(-1)">‹</button><button class="btn small" onclick="calendarAnchor=TODAY;render()">Hôm nay</button><button class="btn small" onclick="calendarMove(1)">›</button></div></div>';let start,end,title;if(calendarMode==='month'){start=new Date(anchor.getFullYear(),anchor.getMonth(),1,12);let gridStart=new Date(start);gridStart.setDate(start.getDate()-((start.getDay()+6)%7));start=gridStart;end=new Date(start);end.setDate(start.getDate()+41);title='Tháng '+String(anchor.getMonth()+1).padStart(2,'0')+'/'+anchor.getFullYear()}else{start=new Date(anchor);start.setDate(anchor.getDate()-((anchor.getDay()+6)%7));end=new Date(start);end.setDate(start.getDate()+6);title='Tuần '+fmtDate(dateKey(start))+' – '+fmtDate(dateKey(end))}let days=[];for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1))days.push(new Date(d));let dow=['T2','T3','T4','T5','T6','T7','CN'].map(x=>'<div class="cal-dow">'+x+'</div>').join('');let cells=days.map(d=>{let key=dateKey(d),dayEvents=events.filter(a=>dateKey(new Date(a.createdAt))===key),other=calendarMode==='month'&&d.getMonth()!==anchor.getMonth();return '<div class="cal-cell '+(other?'other ':'')+(key===nowKey?'today':'')+'" onclick="openActivity(\''+key+'\')"><div class="cal-day">'+d.getDate()+'</div>'+dayEvents.slice(0,3).map(a=>'<div class="cal-event '+(new Date(a.createdAt)>new Date()?'future':'')+'">'+escapeHtml(a.title)+'</div>').join('')+(dayEvents.length>3?'<div class="smalltext muted">+'+(dayEvents.length-3)+'</div>':'')+'</div>'}).join('');let upcoming=events.filter(a=>new Date(a.createdAt)>=new Date()).slice(0,8);return pageHead('Lịch tổng quan','Tổng hợp công việc đã làm và công việc được đặt lịch. Chạm ngày để thêm công việc.','<button class="btn primary" onclick="openActivity()">+ Công việc</button>')+'<section class="card">'+head+'<h3 style="margin-top:12px">'+title+'</h3><div class="calendar-grid">'+dow+cells+'</div></section><section class="card" style="margin-top:12px"><h3>Sắp tới</h3>'+(upcoming.length?'<div class="timeline">'+upcoming.map(a=>'<div class="event"><strong>'+escapeHtml(a.title)+'</strong><div class="smalltext">'+escapeHtml(a.note||'')+'</div><small>'+fmtTime(a.createdAt)+'</small></div>').join('')+'</div>':'<div class="empty-soft">Chưa có công việc tương lai.</div>')+'</section>'}
function renderCatalog(){let el=document.getElementById('catalogList');if(!el)return;let q=(document.getElementById('catSearch')?.value||'').toLowerCase();el.innerHTML=db.catalog.filter(c=>!c.archived&&(!q||(c.kind+' '+c.variety+' '+c.group).toLowerCase().includes(q))).map(c=>'<div class="unknown-item"><strong>'+escapeHtml(c.kind)+' · '+escapeHtml(c.variety)+'</strong><span class="muted"> · '+escapeHtml(c.group)+'</span><button class="btn small" style="float:right" onclick="editCatalog(\''+c.id+'\')">Sửa</button></div>').join('')||'<div class="muted">Không có kết quả.</div>'}

function openPlant(existing,preBlock){let p=existing?db.plantings.find(x=>x.id===existing):null;let opts=db.catalog.filter(c=>!c.archived).map(c=>'<option value="'+c.id+'" '+(p?.catalogId===c.id?'selected':'')+'>'+escapeHtml(c.kind+' · '+c.variety)+'</option>').join('');let chosenBlock=p?.blockId||preBlock||'';let bopts=db.blocks.filter(b=>b.archived!==true&&!b.isReferenceGroup&&b.type!=='Nhóm tham chiếu').map(b=>'<option value="'+b.id+'" '+(chosenBlock===b.id?'selected':'')+'>'+escapeHtml(b.name+' — '+zoneName(b.zoneId))+'</option>').join('');openModal(p?'Sửa cây trồng':'Thêm cây trồng','<form onsubmit="savePlant(event,\''+(p?.id||'')+'\')"><div class="form-grid"><div class="field full"><label>Loại cây / giống</label><div class="plant-picker"><input id="pCatalogSearch" type="search" placeholder="Gõ để tìm: đu đủ, cà chua, dưa leo…" oninput="filterPlantCatalogOptions()"><select id="pCatalog" required><option value="">Chọn cây hoặc giống</option>'+opts+'</select></div><button type="button" class="btn small" style="margin-top:5px" onclick="openCatalog()">+ Thêm giống mới</button></div><div class="field"><label>Block / chậu</label><select id="pBlock"><option value="">Chưa gán vị trí</option>'+bopts+'</select></div><div class="field"><label>Số cây</label><input id="pCount" type="number" value="'+(p?.count||1)+'" min="1" step="1"></div><div class="field"><label>Nguồn cây</label><select id="pSource"><option>Không rõ</option>'+['Hạt','Cây giống','Giâm cành','Chiết/ghép'].map(v=>'<option '+(p?.source===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="field"><label>Tình trạng</label><select id="pCondition">'+['Bình thường','Cần theo dõi','Có vấn đề'].map(v=>'<option '+((p?.condition||'Bình thường')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="field"><label>Ngày gieo</label><div class="date-with-clear"><input id="pSowDate" type="date" value="'+(p?.sown?.date||'')+'"><button type="button" class="btn small" onclick="clearDate(\'pSowDate\')">Xóa</button></div></div><div class="field"><label>Ngày trồng</label><div class="date-with-clear"><input id="pDate" type="date" value="'+(p?.planted?.date||'')+'"><button type="button" class="btn small" onclick="clearDate(\'pDate\')">Xóa</button></div></div><div class="field full"><label>Ghi chú</label><textarea id="pNote">'+escapeHtml(p?.note||'')+'</textarea></div></div><p class="note">Không cần nhập tuổi cây. App tự tính tuổi từ ngày trồng; nếu chưa có ngày trồng sẽ dùng ngày gieo. Cả hai ngày đều có thể để trống.</p><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Hủy</button><button type="submit" class="btn primary">Lưu cây</button></div></form>') }
function sowAccuracyOptions(sel){return [['exact','Chính xác'],['unknown','Không rõ']].map(x=>'<option value="'+x[0]+'" '+(sel===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')}
function accuracyOptions(sel,has){return [['exact','Chính xác'],['range','Khoảng ngày'],['month','Chỉ biết tháng/năm'],['year','Chỉ biết năm'],['unknown','Không rõ']].map(x=>'<option value="'+x[0]+'" '+(sel===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')}
function savePlant(e,editId){e.preventDefault();let cat=document.getElementById('pCatalog').value;if(!cat){toast('Hãy chọn loại cây hoặc giống.');return}let date=document.getElementById('pDate').value,sowd=document.getElementById('pSowDate').value;let planted={date:date||null,accuracy:date?'exact':'unknown',month:null,year:null,endDate:null,age:null},sow={date:sowd||null,accuracy:sowd?'exact':'unknown'};if(date&&sowd&&sowd>date){if(!confirm('Ngày gieo đang sau ngày trồng. Vẫn lưu?'))return}let chosenBlock=document.getElementById('pBlock').value||null,tempPlant={catalogId:cat},bb=chosenBlock&&db.blocks.find(x=>x.id===chosenBlock),need=minDepthForPlant(tempPlant);let soilDepth=bb?effectiveSoilDepthCm(bb):0;if(bb&&soilDepth&&need&&soilDepth<need){if(!confirm('Độ sâu đất thực khoảng '+Math.round(soilDepth)+' cm, thấp hơn mức gợi ý khoảng '+need+' cm cho nhóm cây này. Vẫn lưu?'))return}let old=editId&&db.plantings.find(x=>x.id===editId);undoDb=cloneData(db);let obj={id:old?.id||id('PLT'),catalogId:cat,blockId:chosenBlock,count:+document.getElementById('pCount').value||1,source:document.getElementById('pSource').value,condition:document.getElementById('pCondition').value,status:old?.status||'Đang trồng',planted,sown:sow,note:document.getElementById('pNote').value.trim(),createdAt:old?.createdAt||nowISO(),updatedAt:nowISO()};if(old)Object.assign(old,obj);else db.plantings.push(obj);db.audit.push({at:nowISO(),action:old?'Sửa đợt trồng':'Tạo đợt trồng',target:obj.id});if(persist(old?'Đã cập nhật cây trồng.':'Đã lưu cây trồng.',true))closeModal();else if(undoDb)db=undoDb}

function endPlantAsk(i){let p=db.plantings.find(x=>x.id===i);let linked=db.activities.some(a=>a.plantingId===i);openModal('Kết thúc / lưu trữ đợt trồng','<div class="field"><label>Đợt trồng</label><input value="'+escapeHtml(cropName(i))+'" disabled></div><div class="field"><label>Lý do kết thúc</label><select id="endReason">'+['Thu hoạch xong','Cây chết','Sâu bệnh','Thay cây','Chuyển vị trí','Khác'].map(v=>'<option>'+v+'</option>').join('')+'</select></div><div class="field"><label>Ngày kết thúc</label><input type="date" id="endDate" value="'+TODAY+'"></div><p class="note">Nhật ký liên quan: '+(linked?'có — sẽ được giữ lại.':'chưa có')+' Block sẽ trở về trạng thái trống.</p><div class="modal-actions"><button class="btn" onclick="closeModal()">Hủy</button><button class="btn danger" onclick="confirmEnd(\''+i+'\')">Kết thúc đợt trồng</button></div>')}

function validateGeom(b,skip){if(b.xCm==null||b.yCm==null||!b.lengthCm||!b.widthCm)return '';if(blockShape(b)==='circle'){let r=(b.widthCm||b.lengthCm)/2;if(b.xCm-r<0)return 'Tâm chậu đang cách mốc 0 m phía Tây / bên phải '+Math.round(b.xCm)+' cm nhưng bán kính là '+Math.round(r)+' cm. Hãy kéo tâm vào trong ít nhất '+Math.round(r)+' cm.';if(b.xCm+r>db.garden.lengthCm)return 'Chậu tròn vượt mép Đông / mốc 125 m ở bên trái. Tâm phải cách mép ít nhất '+Math.round(r)+' cm.';if(b.yCm-r<0)return 'Chậu tròn vượt mép trên. Tâm phải cách mép ít nhất '+Math.round(r)+' cm.';if(b.yCm+r>db.garden.widthCm)return 'Chậu tròn vượt mép dưới. Tâm phải cách mép ít nhất '+Math.round(r)+' cm.'}else{let pts=rectCorners(b);if(pts.some(p=>p[0]<0||p[0]>db.garden.lengthCm||p[1]<0||p[1]>db.garden.widthCm))return 'Block vượt ranh giới vườn. Tọa độ đang tính tại TÂM block; hãy kéo block vào trong thêm hoặc giảm kích thước/góc xoay.'}for(let o of db.blocks){if(o.id===skip||o.archived||o.isReferenceGroup||o.type==='Nhóm tham chiếu'||o.xCm==null||o.yCm==null||!o.lengthCm||!o.widthCm)continue;if(blocksOverlap(b,o))return 'Block chồng lấn với '+o.name+'. Hãy kéo sang vị trí khác.'}return ''}
function deleteBlock(i){let b=db.blocks.find(x=>x.id===i),linked=db.plantings.some(p=>p.blockId===i)||db.activities.some(a=>a.blockId===i);if(linked){if(!confirm('Block có dữ liệu liên kết. Lưu trữ để giữ lịch sử?'))return;b.archived=true;closeModal();persist('Đã lưu trữ block và giữ dữ liệu liên kết.')}else if(confirm('Xóa block chưa liên kết?')){db.blocks=db.blocks.filter(x=>x.id!==i);closeModal();persist('Đã xóa block.')}}

function saveZone(e,edit){e.preventDefault();let obj={id:edit||id('KHU'),name:document.getElementById('zName').value.trim(),floorStyle:document.getElementById('zFloor').value,startCm:document.getElementById('zStart').value===''?null:+document.getElementById('zStart').value,lengthCm:document.getElementById('zLen').value===''?null:+document.getElementById('zLen').value,widthCm:document.getElementById('zWidth').value===''?null:+document.getElementById('zWidth').value,note:document.getElementById('zNote').value.trim()};if(!obj.name){toast('Hãy nhập tên khu.');return}let before=cloneData(db.zones);if(edit){let z=db.zones.find(x=>x.id===edit);if(!z){toast('Không tìm thấy khu cần sửa.');return}Object.assign(z,obj)}else db.zones.push(obj);reflowSequentialZones();if(persist('Đã lưu khu và phân bổ lại đúng kích thước thực.'))closeModal();else db.zones=before}

function runChecks(){let out=[],ids={};for(let b of db.blocks){if(ids[b.id])out.push({level:'Lỗi',text:'Mã block trùng: '+b.id});ids[b.id]=1;if(b.xCm!=null&&b.yCm!=null){let e=validateGeom(b,b.id);if(e)out.push({level:'Lỗi',text:b.name+': '+e})}if(!b.lengthCm||!b.widthCm)out.push({level:'Cần xem',text:b.name+': chưa có kích thước'})}for(let p of db.plantings){if(p.blockId&&!db.blocks.some(b=>b.id===p.blockId))out.push({level:'Lỗi',text:'Cây '+p.id+' liên kết đến block không tồn tại.'});if(p.catalogId&&!db.catalog.some(c=>c.id===p.catalogId))out.push({level:'Lỗi',text:'Cây '+p.id+' liên kết đến loại cây không tồn tại.'});if(p.sown?.date&&p.planted?.date&&p.sown.date>p.planted.date)out.push({level:'Cần xem',text:'Ngày gieo sau ngày trồng: '+cropName(p.id)})}return out}

let mapManagerMode='visual',potMgrFilters={zone:'all',group:'all',crop:'all',q:'',state:'all'};
function ensurePotStructure(){
 let changed=false, counters={};
 db.blocks.filter(b=>!b.archived&&!b.isReferenceGroup&&b.type!=='Nhóm tham chiếu').forEach(b=>{
   if(!b.groupId){b.groupId='G-'+b.zoneId+'-'+String(b.name||'CH').replace(/[^A-Za-z0-9]+/g,'-').replace(/-\d+$/,'').toUpperCase();changed=true}
   if(!b.groupLabel){let raw=String(b.name||'CH-01');b.groupLabel=raw.replace(/\.\d+$/,'').replace(/-\d{2,3}$/,'')+'-01';changed=true}
   counters[b.groupId]=(counters[b.groupId]||0)+1;
   if(!b.childNo){b.childNo=counters[b.groupId];changed=true}
 });
 if(changed)try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){}
}
function potCode(b){return (b.groupLabel||b.name||'CH')+'.'+String(b.childNo||1).padStart(2,'0')}
function potGroups(){ensurePotStructure();let m=new Map();db.blocks.filter(b=>!b.archived&&!b.isReferenceGroup&&b.type!=='Nhóm tham chiếu').forEach(b=>{if(!m.has(b.groupId))m.set(b.groupId,{id:b.groupId,label:b.groupLabel||b.name,zoneId:b.zoneId,items:[]});m.get(b.groupId).items.push(b)});return [...m.values()]}
function potPlant(b){return activePlants().find(p=>p.blockId===b.id)}
function potCropOptions(){return [...new Set(activePlants().map(plantDisplayName).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'))}
function managerFilterGroupOptions(){return potGroups().filter(g=>potMgrFilters.zone==='all'||g.zoneId===potMgrFilters.zone)}
function setPotFilter(k,v){potMgrFilters[k]=v;if(k==='zone')potMgrFilters.group='all';render()}
function potMatches(b){let p=potPlant(b),crop=p?plantDisplayName(p):'';if(potMgrFilters.zone!=='all'&&b.zoneId!==potMgrFilters.zone)return false;if(potMgrFilters.group!=='all'&&b.groupId!==potMgrFilters.group)return false;if(potMgrFilters.crop!=='all'&&crop!==potMgrFilters.crop)return false;if(potMgrFilters.state==='occupied'&&!p)return false;if(potMgrFilters.state==='empty'&&p)return false;let q=potMgrFilters.q.trim().toLowerCase();return !q||[potCode(b),b.name,crop,zoneName(b.zoneId)].join(' ').toLowerCase().includes(q)}
function potStats(){let all=db.blocks.filter(b=>!b.archived&&!b.isReferenceGroup&&b.type!=='Nhóm tham chiếu'),occupied=all.filter(potPlant).length;return{all:all.length,occupied,empty:all.length-occupied,care:0}}
function toggleZoneManager(id){let el=document.getElementById('zm-'+id);if(el)el.classList.toggle('hide')}
function renamePotGroup(gid){let g=potGroups().find(x=>x.id===gid);if(!g)return;let n=prompt('Nhãn mã chính mới:',g.label);if(!n||!n.trim())return;n=n.trim().toUpperCase();if(potGroups().some(x=>x.id!==gid&&x.label.toUpperCase()===n)){toast('Nhãn này đã được sử dụng.');return}db.blocks.filter(b=>b.groupId===gid).forEach(b=>{b.groupLabel=n;b.updatedAt=nowISO()});persist('Đã đổi nhãn nhóm. ID hệ thống và liên kết dữ liệu được giữ nguyên.')}
function addPotChild(gid){let g=potGroups().find(x=>x.id===gid),src=g?.items[0];if(!src)return;let nums=g.items.map(x=>+x.childNo||0),n=Math.max(0,...nums)+1,b={...src,id:id('BLK'),name:g.label+'.'+String(n).padStart(2,'0'),groupId:gid,groupLabel:g.label,childNo:n,xCm:null,yCm:null,locked:false,archived:false,createdAt:nowISO(),updatedAt:nowISO()};db.blocks.push(b);db.audit.push({at:nowISO(),action:'Thêm chậu con '+potCode(b),target:b.id});persist('Đã tạo '+potCode(b)+' và đưa vào khay Chưa đặt.')}
function renumberPotGroup(gid){let g=potGroups().find(x=>x.id===gid);if(!g)return;let a=[...g.items].sort((x,y)=>(+x.childNo||999)-(+y.childNo||999)),changes=a.map((b,i)=>potCode(b)+' → '+g.label+'.'+String(i+1).padStart(2,'0'));if(!confirm('Xem trước sắp xếp lại:\n\n'+changes.join('\n')+'\n\nXác nhận áp dụng?'))return;a.forEach((b,i)=>{b.childNo=i+1;b.name=g.label+'.'+String(i+1).padStart(2,'0');b.updatedAt=nowISO()});persist('Đã sắp xếp lại số thứ tự chậu.')}
function bulkEditGroup(gid){let g=potGroups().find(x=>x.id===gid);if(!g)return;openModal('Sửa hàng loạt · '+g.label,'<div class="note">Giữ nguyên ID hệ thống và toàn bộ liên kết cây/nhật ký.</div><div class="modal-actions"><button class="btn" onclick="renumberPotGroup(\''+gid+'\');closeModal()">Sắp xếp lại số</button><button class="btn" onclick="renamePotGroup(\''+gid+'\');closeModal()">Đổi nhãn</button><button class="btn primary" onclick="closeModal()">Xong</button></div>')}
function renderPotManager(){ensurePotStructure();let st=potStats(),groups=potGroups(),zones=db.zones.filter(z=>groups.some(g=>g.zoneId===z.id)),gopts=managerFilterGroupOptions();let filters='<div class="pot-filterbar"><select onchange="setPotFilter(\'zone\',this.value)"><option value="all">Tất cả khu</option>'+zones.map(z=>'<option value="'+z.id+'" '+(potMgrFilters.zone===z.id?'selected':'')+'>'+escapeHtml(z.name)+'</option>').join('')+'</select><select onchange="setPotFilter(\'group\',this.value)"><option value="all">Tất cả mã chậu</option>'+gopts.map(g=>'<option value="'+g.id+'" '+(potMgrFilters.group===g.id?'selected':'')+'>'+escapeHtml(g.label)+'</option>').join('')+'</select><select onchange="setPotFilter(\'crop\',this.value)"><option value="all">Tất cả loại cây</option>'+potCropOptions().map(c=>'<option '+(potMgrFilters.crop===c?'selected':'')+'>'+escapeHtml(c)+'</option>').join('')+'</select><input placeholder="🔍 Mã chậu, cây…" value="'+escapeHtml(potMgrFilters.q)+'" oninput="potMgrFilters.q=this.value;render()"></div>';let chips='<div class="quick-chips">'+[['all','Tất cả '+st.all],['occupied','Có cây '+st.occupied],['empty','Trống '+st.empty],['care','Cần chăm '+st.care]].map(x=>'<button class="quick-chip '+(potMgrFilters.state===x[0]?'active':'')+'" onclick="setPotFilter(\'state\',\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div>';
 let body=zones.map(z=>{let zg=groups.filter(g=>g.zoneId===z.id&&(potMgrFilters.group==='all'||g.id===potMgrFilters.group)),visible=zg.flatMap(g=>g.items).filter(potMatches);if(!visible.length)return'';let cards=zg.map(g=>{let items=g.items.filter(potMatches);if(!items.length)return'';let crops={};items.forEach(b=>{let p=potPlant(b),k=p?plantDisplayName(p):'Trống';crops[k]=(crops[k]||0)+1});let liters=items.reduce((a,b)=>a+(blockVolumeLiters(b)||0),0),summary=Object.entries(crops).map(([k,v])=>v+' '+k).join(' · ');return '<div class="lv2-card"><div class="lv2-head"><div><div class="lv2-title">'+escapeHtml(g.label)+'</div><div class="pot-summary">'+items.length+' chậu · '+escapeHtml(summary)+' · Tổng đất ~'+Math.round(liters)+' L</div></div><div class="lv2-actions"><button class="btn small" onclick="renamePotGroup(\''+g.id+'\')">Đổi nhãn</button><button class="btn small primary" onclick="addPotChild(\''+g.id+'\')">+ Thêm chậu</button><button class="btn small" onclick="bulkEditGroup(\''+g.id+'\')">Sửa hàng loạt</button></div></div>'+items.sort((a,b)=>(+a.childNo||0)-(+b.childNo||0)).map(b=>{let p=potPlant(b),crop=p?plantDisplayName(p):'Trống';return '<div class="pot-row" onclick="openPotSheet(\''+b.id+'\')"><div class="pot-code">'+escapeHtml(potCode(b))+'</div><div class="pot-plant '+(!p?'pot-empty':'')+'">'+escapeHtml(crop)+'</div><div class="pot-summary">'+escapeHtml(blockSizeText(b))+(blockVolumeLiters(b)?' · '+Math.round(blockVolumeLiters(b))+'L':'')+'</div><button class="btn small" onclick="event.stopPropagation();openPotSheet(\''+b.id+'\')">Mở</button></div>'}).join('')+'</div>'}).join('');return '<section class="card lv1-card"><div class="lv1-head" onclick="toggleZoneManager(\''+z.id+'\')"><div><div class="lv1-title">'+escapeHtml(z.name)+'</div><div class="pot-summary">'+zg.length+' nhóm · '+visible.length+' chậu · '+visible.filter(potPlant).length+' cây đang trồng</div></div><span>⌄</span></div><div class="lv1-body" id="zm-'+z.id+'">'+cards+'</div></section>'}).join('');return filters+chips+'<div class="zone-manager">'+(body||'<section class="card manager-empty">Không có chậu phù hợp bộ lọc.</section>')+'</div>'}
function mapModeSwitch(){return '<div class="map-mode-switch"><button class="'+(mapManagerMode==='visual'?'active':'')+'" onclick="mapManagerMode=\'visual\';render()">▦ Sơ đồ trực quan</button><button class="'+(mapManagerMode==='manager'?'active':'')+'" onclick="mapManagerMode=\'manager\';render()">☷ Quản lý chậu</button></div>'}
const renderMapV118=renderMap;
renderMap=function(){ensurePotStructure();if(mapManagerMode==='manager')return pageHead('Sơ đồ','Quản lý theo Khu → Mã chính → Chậu con.','<button class="btn primary" onclick="openBlock()">+ Thêm chậu</button>')+mapModeSwitch()+renderPotManager();let old=renderMapV118();return old.replace(/(<section class="card floor-picker-card">)/,mapModeSwitch()+'$1')}
function closePotSheet(){document.getElementById('potSheetBack')?.remove()}
function openPotSheet(idv){let b=db.blocks.find(x=>x.id===idv);if(!b)return;ensurePotStructure();let p=potPlant(b),age=p?plantAgeLabel(p):'',crop=p?plantDisplayName(p):'';closePotSheet();let el=document.createElement('div');el.id='potSheetBack';el.className='pot-sheet-back';el.onclick=e=>{if(e.target===el)closePotSheet()};el.innerHTML='<div class="pot-sheet"><div class="pot-sheet-grab"></div><div class="pot-sheet-title"><div><h3>'+escapeHtml(potCode(b))+'</h3><div class="muted">Khu: '+escapeHtml(zoneName(b.zoneId))+'</div></div><button class="btn small" onclick="closePotSheet()">✕</button></div><div class="pot-sheet-actions"><button onclick="closePotSheet();'+(p?'editPlant(\''+p.id+'\')':'openPlantForBlock(\''+b.id+'\')')+'">🌱<br>Cây trồng</button><button onclick="closePotSheet();editBlock(\''+b.id+'\')">📐<br>Chậu</button><button onclick="closePotSheet();mapManagerMode=\'visual\';mapSelected=\''+b.id+'\';render()">📍<br>Vị trí</button><button onclick="closePotSheet();openActivityForBlock(\''+b.id+'\')">📝<br>Nhật ký</button><button onclick="closePotSheet();openActivityForBlock(\''+b.id+'\',\'Sâu bệnh\')">⚠️<br>Sự vụ</button></div><div class="pot-sheet-main">'+(p?'<strong>🌱 '+escapeHtml(crop)+'</strong><div class="muted" style="margin-top:5px">Trồng '+escapeHtml(age)+' · '+escapeHtml(blockSizeText(b))+(blockVolumeLiters(b)?' · ~'+Math.round(blockVolumeLiters(b))+' L đất':'')+'</div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="closePotSheet();openActivityForBlock(\''+b.id+'\',\'Chăm sóc\')">Chăm sóc</button><button class="btn" onclick="closePotSheet();editPlant(\''+p.id+'\')">Sửa cây</button></div>':'<strong>Chậu hiện chưa có cây.</strong><div class="row" style="margin-top:12px"><button class="btn primary" onclick="closePotSheet();openPlantForBlock(\''+b.id+'\')">+ Trồng cây</button><button class="btn" onclick="closePotSheet();editBlock(\''+b.id+'\')">Sửa chậu</button></div>')+'</div></div>';document.body.appendChild(el)}
function openActivityForBlock(blockId,type){openActivity();setTimeout(()=>{let b=document.getElementById('aBlock');if(b)b.value=blockId;let t=document.getElementById('aType');if(t&&type)t.value=type},0)}
ensurePotStructure();

render();
let deferredInstallPrompt=null;
function isStandaloneApp(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function isGitHubPages(){return location.hostname.endsWith('.github.io')}
function updateInstallVisibility(){let show=isGitHubPages()&&!isStandaloneApp();let bar=document.getElementById('webInstallBar'),btn=document.getElementById('installBtn');if(bar)bar.classList.toggle('hide',!show);if(btn)btn.classList.toggle('hide',!show)}
async function installApp(){if(isStandaloneApp()){toast('Garden Manager đã được mở ở chế độ ứng dụng.');return}if(!deferredInstallPrompt){alert('Nếu đang dùng Android: mở trang GitHub Pages bằng Chrome rồi chọn menu ⋮ → Cài ứng dụng / Thêm vào màn hình chính. Trên iPhone: mở bằng Safari → Chia sẻ → Thêm vào Màn hình chính.');return}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;updateInstallVisibility()}
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;updateInstallVisibility()});
window.addEventListener('appinstalled',()=>{updateInstallVisibility();toast('Đã cài Garden Manager.')});
window.addEventListener('DOMContentLoaded',updateInstallVisibility);
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',async()=>{try{let reg=await navigator.serviceWorker.register('./service-worker.js?v=119',{updateViaCache:'none'});await reg.update()}catch(err){console.warn('Service Worker update failed',err)}})}
</script></body></html>
